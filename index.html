    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" media="print">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    <script>
      // Immediately apply font stylesheet to prevent render blocking
      const fontLink = document.querySelector('link[as="style"]');
      if (fontLink) {

    <!-- Open Graph / Social Media Sharing -->

  </head>

  <body>
    <!-- Critical above-the-fold content for immediate visibility -->
    <div id="loading-skeleton" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #f8f7f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: Inter, system-ui, sans-serif;
    ">
      <!-- Navigation placeholder -->
      <nav style="position: fixed; top: 0; left: 0; right: 0; height: 64px; background: transparent; display: flex; align-items: center; padding: 0 16px;">
        <h1 style="color: #f9fd8f; font-size: 1.5rem; font-weight: bold; margin: 0;">intro</h1>
        <div style="margin-left: auto;">
          <div style="background: #f9fd8f; color: #1d1d1d; padding: 8px 24px; border-radius: 6px; font-weight: 600;">Join Waitlist</div>
        </div>
      </nav>
      
      <!-- Lightweight hero placeholder to minimize LCP interference -->
      <div style="text-align: center; max-width: 768px; padding: 0 16px; visibility: hidden;">
        <div style="font-size: 3rem; font-weight: bold; color: #1d1d1d; margin: 0 0 24px 0; line-height: 1.1;">
          Loading...
        </div>
        <div style="font-size: 1.25rem; background: #f9fd8f; color: #1d1d1d; padding: 12px 24px; border-radius: 8px; margin: 0 0 48px 0; display: inline-block;">
          Build extra income. Give your friends an intro
        </div>
        <div style="background: #1d1d1d; color: #f8f7f5; padding: 16px 48px; border-radius: 8px; font-size: 1.125rem; font-weight: 600; display: inline-block;">
          Join the Waitlist
        </div>
      </div>
    </div>
    
    <script>
      // Optimized skeleton removal for better LCP
      let skeletonRemoved = false;
      
      function removeSkeleton() {
        if (skeletonRemoved) return;
        const skeleton = document.getElementById('loading-skeleton');
        const root = document.getElementById('root');
        
        if (skeleton && root && root.children.length > 0) {
          skeletonRemoved = true;
          skeleton.style.opacity = '0';
          skeleton.style.transition = 'opacity 0.15s ease';
          setTimeout(() => {
            if (skeleton.parentNode) {
              skeleton.remove();
            }
          }, 150);
        }
      }
      
      // Multiple triggers for faster skeleton removal
      window.addEventListener('DOMContentLoaded', removeSkeleton);
      
      // Check for React app mount more frequently
      const checkInterval = setInterval(function() {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          clearInterval(checkInterval);
          removeSkeleton();
        }
      }, 16); // Check every frame
      
      // Fallback removal after reasonable time
      setTimeout(function() {
        clearInterval(checkInterval);
        removeSkeleton();
      }, 2000);
    </script>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
