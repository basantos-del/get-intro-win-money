    <!-- Critical above-the-fold content for immediate visibility -->
    <div id="loading-skeleton" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #f8f7f5;
      display: flex;
      flex-direction: column;

        <div style="font-size: 3rem; font-weight: bold; color: #1d1d1d; margin: 0 0 24px 0; line-height: 1.1;">
          Loading...
        </div>
        <div style="font-size: 1.25rem; background: #f9fd8f; color: #1d1d1d; padding: 12px 24px; border-radius: 8px; margin: 0 0 48px 0; display: inline-block;">
          Build extra income. Give your friends an intro
        </div>
        <div style="background: #1d1d1d; color: #f8f7f5; padding: 16px 48px; border-radius: 8px; font-size: 1.125rem; font-weight: 600; display: inline-block;">
          Join the Waitlist
        </div>
      </div>
    </div>
    
    <script>
      // Aggressive skeleton removal for immediate video display
      let skeletonRemoved = false;
      
      function removeSkeleton() {
        if (skeletonRemoved) return;
        const skeleton = document.getElementById('loading-skeleton');
        const root = document.getElementById('root');
        
        if (skeleton) {
          skeletonRemoved = true;
          console.log('Removing loading skeleton');
          skeleton.style.opacity = '0';
          skeleton.style.transition = 'opacity 0.1s ease';
          setTimeout(() => {
            if (skeleton.parentNode) {
              skeleton.remove();
              console.log('Loading skeleton removed');
            }
          }, 100);
        }
      }

      // Immediate removal on any content load
      function forceRemoveIfNeeded() {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          removeSkeleton();
        }
      }
      
      // Multiple aggressive triggers
      window.addEventListener('DOMContentLoaded', removeSkeleton);
      window.addEventListener('load', removeSkeleton);
      document.addEventListener('readystatechange', removeSkeleton);
      
      // Very frequent checks for React app mount
      const checkInterval = setInterval(forceRemoveIfNeeded, 10); // Check every 10ms
      
      // Reduced fallback timeout - force removal after 800ms
      setTimeout(function() {
        clearInterval(checkInterval);
        removeSkeleton();
        console.log('Skeleton removal fallback triggered');
      }, 800);

      // Global function for video to trigger skeleton removal
      window.removeSkeletonOnVideoLoad = function() {
        console.log('Video load triggered skeleton removal');
        removeSkeleton();
      };

      // Visibility change detection
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          removeSkeleton();
        }
      });
    </script>
    
    <div id="root"></div>
